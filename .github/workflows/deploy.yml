name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy & Migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install EF Tool
        run: dotnet tool install --global dotnet-ef

      - name: Run Database Migrations
        env:
          ConnectionStrings__Postgres: ${{ secrets.PROD_DB_CONNECTION }}
        run: dotnet ef database update --project src/ECommerce.Infrastructure --startup-project src/ECommerce.API

      - name: Deploy API
        run: |
          echo "Deploying to production server..."
          # Pull the latest image (tagged by the workflow that created it)
          echo "New image: ${{ github.event.head_commit.id }}"
          # In a real deployment, you would:
          # - docker pull ghcr.io/Mohamed-ehab-mohy/ecommerce-api:${{ github.sha }}
          # - kubectl rollout restart deployment/ecommerce-api (or equivalent)
          # - or deploy to Azure Web App, ECS, etc.
          echo "Deployment successful."

      - name: Deploy API
        run: |
          echo "Deploying to production server..."
          # Insert deployment script (e.g. docker pull, helm upgrade, or Azure Web App deploy)
          echo "Deployment successful."
