name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore
      - name: Build (warnings-as-errors)
        run: dotnet build --no-restore -warnaserror

  unit-tests:
    name: Unit + Architecture Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Unit Tests
        run: dotnet test tests/ECommerce.UnitTests --no-build --logger "trx;LogFileName=unit.trx"
      - name: Architecture Tests
        run: dotnet test tests/ECommerce.ArchitectureTests --no-build --logger "trx;LogFileName=arch.trx"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Integration Tests
        run: dotnet test tests/ECommerce.IntegrationTests --no-build --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 3m

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore
      - name: Format
        run: dotnet format --verify-no-changes

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: high

  load-test:
    name: Load Test (k6 smoke)
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Start infrastructure services
        run: docker compose up -d postgres redis rabbitmq

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Postgres..."
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U ecommerce -d ecommerce >/dev/null 2>&1; do sleep 2; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until docker compose exec -T redis redis-cli ping >/dev/null 2>&1; do sleep 2; done'
          echo "Waiting for RabbitMQ..."
          timeout 60 bash -c 'until docker compose exec -T rabbitmq rabbitmq-diagnostics -q ping >/dev/null 2>&1; do sleep 2; done'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore & Build
        run: |
          dotnet restore
          dotnet build --no-restore

      - name: Run API server
        run: |
          dotnet run --project src/ECommerce.API --no-build &
          echo "API_PID=$!" >> "$GITHUB_ENV"

          echo "Waiting for API to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:8080/health >/dev/null 2>&1; do sleep 2; done'

      - uses: grafana/k6-action@v0.3.1
        with:
          filename: perf/k6/ci-smoke.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results
          path: summary.json
          if-no-files-found: ignore

      - name: Tear down services
        if: always()
        run: |
          kill "$API_PID" 2>/dev/null || true
          docker compose down -v
