apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-api
  namespace: ecommerce
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - ecommerce.example.com
      secretName: ecommerce-tls
  rules:
    - host: ecommerce.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ecommerce-api
                port:
                  number: 80
          - path: /grpc
            pathType: Prefix
            backend:
              service:
                name: ecommerce-api
                port:
                  number: 80
